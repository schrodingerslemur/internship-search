<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Internship Search{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<script src="/static/htmx.min.js" defer></script>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --line:#2a2f3a;
  --text:#e6e9ef; --muted:#98a1b3; --dim:#6c7689;
  --accent:#5b8cff; --accent-dim:#2f4d8f;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --hot:#ff7b47;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f0f2f5; --line:#dfe3ea;
    --text:#12151b; --muted:#5b6472; --dim:#828b9a;
    --accent:#2f6bff; --accent-dim:#c7d7ff;
  }
}
*{box-sizing:border-box}
nav details.account{position:relative;margin-left:10px}
nav details.account summary{list-style:none;cursor:pointer;width:30px;height:30px;border-radius:50%;
 background:var(--accent-dim);color:var(--text);display:grid;place-items:center;font-size:13px;font-weight:700}
nav details.account summary::-webkit-details-marker{display:none}
nav details.account .account-menu{position:absolute;right:0;top:38px;min-width:190px;z-index:30;
 background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;
 box-shadow:0 10px 30px rgba(0,0,0,.28)}
.account-menu .account-who{font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);
 margin-bottom:4px;overflow:hidden;text-overflow:ellipsis}
.account-menu a,.account-menu button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;
 background:none;color:var(--text);font:inherit;font-size:13.5px;border-radius:6px;cursor:pointer}
.account-menu a:hover,.account-menu button:hover{background:var(--panel-2);text-decoration:none}
main.bare{max-width:none;padding:0}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
 border-radius:14px;padding:28px}
.auth-brand{font-weight:700;font-size:15px;margin-bottom:18px}
.auth-title{font-size:20px;margin:0 0 6px}
.auth-sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.auth-error{background:rgba(248,81,73,.12);border:1px solid var(--bad);color:var(--bad);
 padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px}
.auth-form{display:grid;gap:14px}
.auth-form label{display:grid;gap:6px}
.auth-form label span{font-size:12.5px;color:var(--muted)}
.auth-form input{background:var(--bg);border:1px solid var(--line);color:var(--text);
 border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;width:100%}
.auth-form input:focus{outline:none;border-color:var(--accent)}
.auth-form button{margin-top:4px;padding:11px}
.auth-alt{margin-top:18px;text-align:center;font-size:13px;color:var(--muted)}
body{margin:0;background:var(--bg);color:var(--text);
 font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);
 border-bottom:1px solid var(--line);padding:0 20px}
nav{display:flex;align-items:center;gap:4px;max-width:1400px;margin:0 auto;flex-wrap:wrap}
nav .brand{font-weight:700;font-size:16px;padding:14px 14px 14px 0;color:var(--text)}
nav a.tab{padding:14px 12px;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
nav a.tab:hover{color:var(--text);text-decoration:none}
nav a.tab.active{color:var(--text);border-bottom-color:var(--accent)}
nav .spacer{flex:1}
main{max-width:1400px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:26px 0 12px}
h3{font-size:14px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .n{font-size:26px;font-weight:700;line-height:1.1}
.stat .l{color:var(--muted);font-size:12px;margin-top:4px}
.stat.hot .n{color:var(--hot)}
.stat.strong .n{color:var(--accent)}
.job{background:var(--panel);border:1px solid var(--line);border-radius:10px;
 padding:14px 16px;margin-bottom:10px;display:flex;gap:16px;align-items:flex-start}
.job:hover{border-color:var(--accent-dim)}
.job .score{flex:0 0 62px;text-align:center}
.job .score .v{font-size:21px;font-weight:700;line-height:1}
.job .score .m{font-size:10px;color:var(--dim)}
.score-90 .v{color:var(--hot)} .score-80 .v{color:var(--accent)}
.score-70 .v{color:var(--ok)} .score-60 .v{color:var(--warn)} .score-low .v{color:var(--dim)}
.job .body{flex:1;min-width:0}
.job .co{font-weight:650;font-size:15px}
.job .ti{font-size:14px;margin-top:1px}
.job .meta{color:var(--muted);font-size:12.5px;margin-top:5px;display:flex;
 flex-wrap:wrap;gap:10px;align-items:center}
.chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:20px;
 padding:2px 9px;font-size:11.5px;color:var(--muted)}
.chip.good{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{background:var(--panel-2);color:var(--text);border:1px solid var(--line);
 border-radius:7px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600}
.badge.new{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.updated{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.reposted{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.badge.expired{background:var(--panel-2);color:var(--dim)}
.sources{font-size:11.5px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;
 text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
form.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
input,select,textarea{background:var(--panel);color:var(--text);border:1px solid var(--line);
 border-radius:7px;padding:7px 10px;font-size:13.5px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{width:100%;min-height:90px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
.field{margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.help{font-size:11.5px;color:var(--dim);margin-top:4px}
.kanban{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px}
.col h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:9px;margin-bottom:7px;font-size:12.5px}
.bar{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:44px 20px}
.note{background:var(--panel-2);border-left:3px solid var(--accent);padding:10px 13px;
 border-radius:0 7px 7px 0;font-size:13px;margin-bottom:12px}
.note.warn{border-left-color:var(--warn)}
.note.bad{border-left-color:var(--bad)}
.pill{font-size:11px;padding:1px 7px;border-radius:20px;background:var(--panel-2);color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.split{display:grid;grid-template-columns:2fr 1fr;gap:18px}
@media(max-width:900px){.split{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(7,240px)}}
.prose{font-size:13.5px;line-height:1.65;white-space:pre-wrap;color:var(--text);
 max-height:460px;overflow-y:auto;background:var(--panel-2);padding:13px;border-radius:8px}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:3px 0;font-size:13px}
</style>
</head>
<body>
{% if not hide_nav %}
<header class="top">
  <nav>
    <span class="brand">🚀 Internship Search</span>
    <a class="tab {% if request.url.path=='/' %}active{% endif %}" href="/">Jobs</a>
    <a class="tab {% if request.url.path=='/tracker' %}active{% endif %}" href="/tracker">Tracker</a>
    <a class="tab {% if request.url.path in ['/coverage','/analytics'] %}active{% endif %}" href="/coverage">Insights</a>
    <a class="tab {% if request.url.path in ['/settings','/profile'] %}active{% endif %}" href="/settings">Settings</a>
    <span class="spacer"></span>
    <form method="post" action="/run-search" style="margin:0">
      <button class="btn sm" type="submit">Run search</button>
    </form>
    {% if current_user %}
    <details class="account">
      <summary title="{{ current_user.email }}">{{ (current_user.name or current_user.email)[:1]|upper }}</summary>
      <div class="account-menu">
        <div class="account-who">{{ current_user.email }}</div>
        <a href="/profile">Your profile</a>
        <a href="/settings">Preferences</a>
        <form method="post" action="/logout"><button type="submit">Sign out</button></form>
      </div>
    </details>
    {% endif %}
  </nav>
</header>
{% endif %}
<main{% if hide_nav %} class="bare"{% endif %}>
{% block content %}{% endblock %}
</main>
</body>
</html>
