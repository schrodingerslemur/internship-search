{# Swapped alongside the board, so the headline numbers can never describe a
   board that is no longer on screen. #}
<div class="stats">
  <div class="stat"><div class="n">{{ counts.applied }}</div><div class="l">Applications</div></div>
  <div class="stat"><div class="n">{{ counts.interviews }}</div><div class="l">Interviews</div></div>
  <div class="stat"><div class="n">{{ counts.offers }}</div><div class="l">Offers</div></div>
  <div class="stat"><div class="n">{{ counts.saved }}</div><div class="l">Saved for later</div></div>
</div>
