# Fly.io deployment. One machine runs both the dashboard and the scheduler,
# with a persistent volume so the database survives restarts and redeploys.
#
# Rename `app` below to something unique before the first deploy.

app = "internship-search"
primary_region = "ewr"          # Newark: closest region to Pittsburgh

[build]

[env]
  APP_HOST = "0.0.0.0"
  APP_PORT = "8080"
  LOG_FORMAT = "json"
  TIMEZONE = "America/New_York"
  DATABASE_URL = "sqlite:////app/data/internship.db"
  SCHEDULER_ENABLED = "true"

[[mounts]]
  source = "internship_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The scheduler must be running at 08:00 and 16:00 whether or not anyone has
  # opened the dashboard, so the machine is never allowed to stop.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[checks.health]
  type = "http"
  port = 8080
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  # 256MB is enough to serve the dashboard but not to run a full pipeline pass
  # over thousands of listings; 512MB is the smallest size that does not OOM.
  memory = "512mb"
  cpus = 1
