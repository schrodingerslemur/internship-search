# Twice-daily internship digest, entirely on free infrastructure.
#
# GitHub Actions supplies the schedule and the compute; a free hosted Postgres
# supplies the memory between runs. Nothing is always-on, so nothing is billed.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL     Neon/Supabase connection string, pasted as given
#   SMTP_HOST        smtp.gmail.com
#   SMTP_USER        you@gmail.com
#   SMTP_PASSWORD    16-character Gmail app password
#   EMAIL_TO         where the digest should land

name: Internship digest

on:
  # GitHub cron is UTC and does not observe daylight saving, so each local
  # send time is scheduled at both of its possible UTC hours and the job
  # itself decides which one is really 08:00 / 16:00 in New York.
  schedule:
    - cron: "0 12 * * *"   # 08:00 EDT
    - cron: "0 13 * * *"   # 08:00 EST
    - cron: "0 20 * * *"   # 16:00 EDT
    - cron: "0 21 * * *"   # 16:00 EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the pipeline but do not send or record the digest"
        type: boolean
        default: false

# A search run can outlive its slot; never let two of them write concurrently.
concurrency:
  group: internship-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: America/New_York
      DIGEST_HOURS: "8,16"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      # The scheduler is the workflow itself; an in-process one would never
      # live long enough to fire.
      SCHEDULER_ENABLED: "false"
      LOG_FORMAT: json
      TIMEZONE: America/New_York
      # Optional extras -- absent secrets leave these empty and the matching
      # source simply reports itself unconfigured.
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
      USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}

    steps:
      # Cheapest possible step, and first: four cron entries fire each day but
      # only two of them are the right local hour, so the rest exit here in
      # seconds. Python's zoneinfo rather than `date`, because it gets DST
      # right without depending on the runner's TZ handling.
      - name: Is this the right local hour?
        id: gate
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo(os.environ["TIMEZONE"])
          now = datetime.now(tz)
          hours = {int(h) for h in os.environ["DIGEST_HOURS"].split(",")}
          manual = os.environ["EVENT_NAME"] != "schedule"
          proceed = manual or now.hour in hours

          print(f"Local time: {now:%Y-%m-%d %H:%M %Z}")
          print("Manual run -- proceeding." if manual
                else f"Hour {now.hour} {'is' if proceed else 'is not'} a digest hour.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              print(f"proceed={'true' if proceed else 'false'}", file=fh)
          PY
        env:
          EVENT_NAME: ${{ github.event_name }}

      - uses: actions/checkout@v4
        if: steps.gate.outputs.proceed == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.gate.outputs.proceed == 'true'
        run: pip install -e ".[postgres]"

      - name: Migrate
        if: steps.gate.outputs.proceed == 'true'
        run: python -m alembic upgrade head

      - name: Search and send digest
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python -m app.cli search \
            --trigger github-actions \
            --kind auto \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Runs even when the search failed, so a failed run still shows what the
      # database looked like afterwards.
      - name: Summary
        if: always() && steps.gate.outputs.proceed == 'true'
        run: |
          {
            echo "### Database after this run"
            echo '```'
            python -m app.cli stats || echo "stats unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
