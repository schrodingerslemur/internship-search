# Internship digest, entirely on free infrastructure.
#
# GitHub Actions supplies the schedule and the compute; a free hosted Postgres
# supplies the memory between runs. Nothing is always-on, so nothing is billed.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL     Neon/Supabase connection string, pasted as given
#   SMTP_HOST        smtp.gmail.com
#   SMTP_USER        you@gmail.com
#   SMTP_PASSWORD    16-character Gmail app password
#   EMAIL_TO         where the digest should land
# Optional:
#   PUBLIC_BASE_URL  https://<your-app>.onrender.com -- makes the digest's
#                    dashboard link point somewhere real
#   LLM_API_KEY      enables enrichment against the deployed database. Without
#                    it the deployed corpus is never enriched at all, because
#                    the local backfill writes to a different database and its
#                    results do not travel. See the LLM_* block below.
#   ADZUNA_APP_ID    free at developer.adzuna.com. One aggregator reaches the
#   ADZUNA_APP_KEY   large employers that would each need a bespoke adapter

name: Internship digest

on:
  # Twice a day. Every three hours used up the free database's monthly
  # transfer allowance in two weeks. Cron runs in UTC, so these land at
  # 8am and 5pm Eastern in summer and an hour earlier in winter.
  schedule:
    - cron: "0 12,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the pipeline but do not send or record the digest"
        type: boolean
        default: false

# A search run can outlive its slot; never let two of them write concurrently.
concurrency:
  group: internship-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # A healthy run is about six minutes; this is a ceiling for a pathological
    # one, not a target. It was 45 when persistence still took 34 minutes.
    timeout-minutes: 60

    env:
      TZ: America/New_York
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      # Makes the "View the full dashboard" link in each digest point at the
      # deployed dashboard. Unset, it falls back to localhost, which is only
      # useful if you happen to be running the app on the machine you read
      # the email on.
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      # The scheduler is the workflow itself; an in-process one would never
      # live long enough to fire.
      SCHEDULER_ENABLED: "false"
      LOG_FORMAT: json
      TIMEZONE: America/New_York
      # Reading postings the hand-written vocabulary cannot. Enrichment is
      # additive and entirely optional: with no key these stay empty, the
      # client reports itself unavailable, and the run behaves exactly as it
      # did before.
      #
      # With a key it is the *only* thing that enriches the deployed corpus.
      # The local backfill writes to a different database -- sqlite here,
      # Postgres there -- so its results never travel, and the deployed
      # corpus has never had a single posting read.
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://api.groq.com/openai/v1
      # Cheapest of the three usable Groq models and, on this corpus, also the
      # most accurate: about 500 tokens a posting against 2,000 for the 120b.
      LLM_MODEL: openai/gpt-oss-20b
      LLM_ENABLED: "true"
      # Groq's free tier allows 8k tokens a minute and 200k a day, so a run
      # asked to read hundreds of postings would spend most of its time
      # asleep waiting out rate limits. Each run takes a bite; the next one
      # continues where it stopped.
      LLM_MAX_CALLS_PER_RUN: "40"
      LLM_TIMEOUT_SECONDS: "45"

      # Optional extras -- absent secrets leave these empty and the matching
      # source simply reports itself unconfigured.
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
      USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[postgres]"

      - name: Migrate
        run: python -m alembic upgrade head

      - name: Search and send digest
        run: |
          python -m app.cli search \
            --trigger github-actions \
            --kind auto \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Runs even when the search failed, so a failed run still shows what the
      # database looked like afterwards.
      - name: Summary
        if: always()
        run: |
          {
            echo "### Database after this run"
            echo '```'
            python -m app.cli stats || echo "stats unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
