# Render blueprint for the dashboard, on the free plan.
#
# This hosts the *dashboard only*. The daily digests are sent by the
# GitHub Actions workflow, and the database lives in Neon, so this service
# holds no state of its own: it can sleep, restart or be rebuilt without
# losing anything or missing a digest.
#
# Set in the Render dashboard (marked sync: false below, so it is never
# committed): DATABASE_URL.
#
# There is no dashboard password: the app has real accounts. The first person
# to sign up adopts the existing single-user data; everyone after that gets
# their own account, preferences and digest.

services:
  - type: web
    name: internship-search
    runtime: docker
    plan: free
    region: ohio          # same side of the country as the Neon project
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # The Neon connection string, pasted as given.
      - key: DATABASE_URL
        sync: false
      # Fine-grained GitHub token, "Actions: read and write" on this repo only.
      # Lets a right swipe start the auto-apply worker immediately; without it
      # the worker runs once a day, right after the digest.
      - key: GH_DISPATCH_TOKEN
        sync: false
      # The GitHub Actions workflow owns the schedule. A second scheduler here
      # would send every digest twice.
      - key: SCHEDULER_ENABLED
        value: "false"
      # Actions discovers boards during the daily pull. Avoid seed checks and
      # background crawling whenever this ephemeral dashboard starts.
      - key: BOOTSTRAP_SEED_ENABLED
        value: "false"
      - key: TIMEZONE
        value: America/New_York
      - key: LOG_FORMAT
        value: json
      - key: APP_HOST
        value: 0.0.0.0
