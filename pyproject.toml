[project]
name = "internship-search"
version = "0.1.0"
description = "Personal internship search agent: search broadly, deduplicate aggressively, rank intelligently, notify selectively."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "tenacity>=9.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "apscheduler>=3.11",
    "structlog>=24.4",
    "python-dateutil>=2.9",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.8", "httpx>=0.28"]

[project.scripts]
internship-search = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
